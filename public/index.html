<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{
  var t = localStorage.getItem('dateline-theme');
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
}catch(e){}})();</script>
<title>The Date Line — Ankit's morning briefing</title>
<meta name="description" content="Every edition of Ankit's morning briefing, in one searchable archive. Doha, daily.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1A1815">
<meta name="apple-mobile-web-app-title" content="The Date Line">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --ink: #1A1815; --paper: #F7F4EA; --paper-2: #EFEADC; --hair: #D9D3C2;
    --muted: #6E6A5E; --body: #3A362D; --bar: #1A1815; --bar-text: #F7F4EA; --gold: #856420;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", Times, serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --accent-world: #2B4257; --accent-sports: #A8482C; --accent-business: #8A6A1E;
    --accent-ai: #1F6B64; --accent-geopolitics: #3E5C8A; --accent-portfolio: #47633F;
    --accent-country: #8C3A3A; --accent-doha: #63456F;
  }
  [data-theme="dark"] {
    --ink: #ECE7DA; --paper: #15140F; --paper-2: #1E1C16; --hair: #332F26;
    --muted: #9B9483; --body: #CFC9B9; --gold: #C9A24E;
    --accent-world: #7FA5CC; --accent-sports: #E08863; --accent-business: #D9AA55;
    --accent-ai: #5FBDB3; --accent-geopolitics: #8CACD6; --accent-portfolio: #8AB183;
    --accent-country: #D97A7A; --accent-doha: #B08BC2;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink);
    font-family: var(--serif); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  ::selection { background: var(--gold); color: var(--paper); }
  [data-theme="dark"] ::selection { color: #15140F; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  * { scrollbar-color: var(--hair) transparent; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: var(--hair); }
  ::-webkit-scrollbar-track { background: transparent; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 34px; }

  /* --- Brand bar --- */
  .brand-bar { background: var(--bar); color: var(--bar-text); }
  .brand-bar-inner { max-width: 1120px; margin: 0 auto; padding: 10px 34px;
    display: flex; align-items: center; gap: 11px; }
  .mark { height: 21px; width: auto; display: block; flex: none; }
  .brand-word { font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: 0.17em; text-transform: uppercase; text-decoration: none;
    color: inherit; white-space: nowrap; display: flex; align-items: center; gap: 11px; }
  .brand-spacer { flex: 1; }
  .brand-note { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    opacity: .72; white-space: nowrap; }
  .theme-toggle { flex: none; width: 28px; height: 28px; border: 1px solid rgba(247,244,234,.24);
    background: transparent; color: inherit; display: inline-flex; align-items: center;
    justify-content: center; cursor: pointer; padding: 0; transition: background .15s ease; }
  .theme-toggle:hover { background: rgba(247,244,234,.12); }
  .theme-toggle svg { width: 14px; height: 14px; }
  .theme-toggle .icon-moon { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: inline-block; }

  /* --- Masthead --- */
  .masthead { max-width: 1120px; margin: 0 auto; padding: 46px 34px 0; text-align: center; }
  .dateline { display: flex; align-items: center; gap: 18px; justify-content: center;
    margin-bottom: 20px; }
  .dateline .rail { height: 1px; background: var(--gold); flex: 1; max-width: 230px; }
  .dateline .stamp { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.16em;
    text-transform: uppercase; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .nameplate { font-weight: 400; font-size: clamp(40px, 7.2vw, 68px); line-height: 1;
    letter-spacing: -0.018em; margin: 0 0 14px; }
  .standfirst { font-family: var(--mono); font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 22px;
    font-variant-numeric: tabular-nums; }
  .rule-double { border-top: 2.5px solid var(--ink); border-bottom: 1px solid var(--ink);
    height: 4px; }

  /* --- Search + topics --- */
  .finder { max-width: 1120px; margin: 0 auto; padding: 26px 34px 0; }
  .search-row { position: relative; display: flex; align-items: center; }
  .search-icon { position: absolute; left: 0; width: 16px; height: 16px; color: var(--muted);
    pointer-events: none; }
  .search-input { width: 100%; padding: 13px 34px 13px 28px; border: none;
    border-bottom: 1px solid var(--ink); background: none; color: var(--ink);
    font-family: var(--serif); font-size: 19px; }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { outline: none; border-bottom-color: var(--gold); }
  .search-clear { position: absolute; right: 0; width: 24px; height: 24px; border: none;
    background: none; color: var(--muted); cursor: pointer; display: none;
    align-items: center; justify-content: center; padding: 0; }
  .search-clear.show { display: flex; }
  .search-clear:hover { color: var(--ink); }
  .search-clear svg { width: 13px; height: 13px; }
  .topics { display: flex; flex-wrap: wrap; gap: 0; margin-top: 16px;
    border-bottom: 1px solid var(--hair); }
  .topic { font-family: var(--mono); font-size: 11px; letter-spacing: 0.13em;
    text-transform: uppercase; background: none; border: none; color: var(--muted);
    padding: 10px 14px 10px 0; cursor: pointer; position: relative;
    transition: color .15s ease; }
  .topic:hover { color: var(--ink); }
  .topic.active { color: var(--t); font-weight: 700; }
  .topic.active::after { content: ""; position: absolute; left: 0; right: 14px; bottom: 3px;
    height: 2px; background: var(--t); }

  /* --- Latest edition --- */
  .content { padding: 34px 0 0; }
  .latest { display: grid; grid-template-columns: 1.15fr 1fr; gap: 34px;
    border-top: 2px solid var(--ink); padding-top: 22px; margin-bottom: 52px;
    text-decoration: none; align-items: start; }
  .latest-media { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden;
    background: var(--paper-2); }
  .latest-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .latest-media .ph-fallback { position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; color: var(--hair); background: var(--paper-2); }
  .latest-media .ph-fallback .mark { height: 48px; }
  .latest-body { display: flex; flex-direction: column; gap: 13px; }
  .latest-kicker { font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
  .latest h2 { font-weight: 400; font-size: clamp(30px, 4vw, 44px); line-height: 1.12;
    margin: 0; letter-spacing: -0.018em; }
  .latest:hover h2 { text-decoration: underline; text-underline-offset: 5px;
    text-decoration-thickness: 1px; }
  .latest-standfirst { font-size: 17px; line-height: 1.5; color: var(--body); margin: 0;
    max-width: 46ch; }
  .latest-cta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--muted); }

  .block-label { font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: 0.17em; text-transform: uppercase; color: var(--ink); margin: 0 0 20px;
    display: flex; align-items: center; gap: 16px; white-space: nowrap; }
  .block-label::after { content: ""; height: 1px; background: var(--hair); flex: 1; }

  /* --- Edition index --- */
  .editions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px 34px; }
  .ed-card { display: flex; flex-direction: column; gap: 11px; text-decoration: none;
    border-top: 1px solid var(--hair); padding-top: 14px; }
  .ed-media { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
    background: var(--paper-2); }
  .ed-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ed-media .ph-fallback { position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; color: var(--hair); background: var(--paper-2); }
  .ed-media .ph-fallback .mark { height: 34px; }
  .ed-date { font-family: var(--mono); font-size: 11px; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--gold); font-variant-numeric: tabular-nums; }
  .ed-cap { font-size: 16.5px; line-height: 1.45; margin: 0; color: var(--body); }
  .ed-card:hover .ed-cap { text-decoration: underline; text-underline-offset: 3px;
    text-decoration-thickness: 1px; }

  /* --- Search results --- */
  .result { display: block; padding: 17px 0; border-bottom: 1px solid var(--hair);
    text-decoration: none; }
  .result:hover .r-headline { text-decoration: underline; text-underline-offset: 3px; }
  .r-meta { display: flex; align-items: center; gap: 11px; margin-bottom: 7px; flex-wrap: wrap; }
  .chip { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; padding: 3px 7px; border: 1px solid; }
  .r-date { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
  .r-headline { font-size: 19px; line-height: 1.3; margin: 0 0 5px; }
  .r-body { font-size: 14.5px; line-height: 1.6; color: var(--body); margin: 0; max-width: 72ch; }
  mark { background: none; color: inherit; box-shadow: inset 0 -0.42em 0 color-mix(in srgb, var(--gold) 34%, transparent); }

  .empty { text-align: center; color: var(--muted); font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase; padding: 52px 20px;
    border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }

  .pager { display: flex; align-items: center; justify-content: center; gap: 4px;
    flex-wrap: wrap; margin: 38px 0 0; }
  .pager-btn, .pager-num { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink); background: none; border: 1px solid var(--hair);
    padding: 8px 13px; cursor: pointer; transition: border-color .15s ease, background .15s ease; }
  .pager-num { padding: 8px 11px; min-width: 36px; font-variant-numeric: tabular-nums; }
  .pager-btn:hover:not(:disabled), .pager-num:hover:not(.active) { border-color: var(--ink); }
  .pager-num.active { background: var(--ink); border-color: var(--ink); color: var(--paper);
    cursor: default; }
  .pager-btn:disabled { opacity: 0.35; cursor: default; }
  .pager-ellipsis { padding: 8px 3px; color: var(--muted); font-family: var(--mono); font-size: 11px; }

  .colophon { max-width: 1120px; margin: 64px auto 0; padding: 26px 34px 64px;
    text-align: center; border-top: 1px solid var(--ink); }
  .colophon .mark { height: 26px; margin: 0 auto 14px; color: var(--ink); }
  .colophon p { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
    color: var(--muted); margin: 0; line-height: 1.9; }

  .back-to-top { position: fixed; right: 22px; bottom: 22px; z-index: 60; width: 42px;
    height: 42px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    opacity: 0; pointer-events: none; transform: translateY(6px);
    transition: opacity .25s cubic-bezier(.2,.7,.3,1), transform .25s cubic-bezier(.2,.7,.3,1); }
  .back-to-top.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .back-to-top:hover { background: var(--ink); color: var(--paper); }
  .back-to-top svg { width: 17px; height: 17px; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  @media (max-width: 900px) {
    .editions { grid-template-columns: repeat(2, 1fr); }
    .latest { grid-template-columns: 1fr; gap: 18px; }
  }
  @media (max-width: 620px) {
    .brand-bar-inner { padding: 9px 18px; }
    .brand-note { display: none; }
    .wrap, .masthead, .finder, .colophon { padding-left: 18px; padding-right: 18px; }
    .masthead { padding-top: 34px; }
    .dateline { gap: 12px; margin-bottom: 16px; }
    .dateline .rail { max-width: 40px; }
    .dateline .stamp { font-size: 11px; letter-spacing: 0.1em; }
    .editions { grid-template-columns: 1fr; }
    .topics { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      -webkit-mask-image: linear-gradient(90deg, #000 86%, transparent 100%);
      mask-image: linear-gradient(90deg, #000 86%, transparent 100%); }
    .topics.scroll-end { -webkit-mask-image: none; mask-image: none; }
    .topics::-webkit-scrollbar { display: none; }
    .topic { white-space: nowrap; }
    .back-to-top { right: 14px; bottom: 14px; width: 38px; height: 38px; }
  }
</style>
</head>

<script>
(function () {
  var MARK = '<svg class="mark" viewBox="11 3 42 58" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M24 22a11 11 0 1 0 0 22 11 11 0 1 0 0-22Zm-.6 3a5.6 8 0 1 0 0 16 5.6 8 0 1 0 0-16Z"/><rect x="36" y="40.6" width="15" height="3.4"/><rect x="30" y="5" width="2.5" height="54"/><rect x="33.5" y="5" width="2.5" height="54"/><rect x="30" y="5" width="6" height="1.5"/><rect x="30" y="8" width="6" height="2"/><rect x="30" y="11.5" width="6" height="2"/><rect x="30" y="15" width="6" height="2"/><rect x="30" y="18.5" width="6" height="2"/><rect x="30" y="22" width="6" height="2"/><rect x="30" y="25.5" width="6" height="2"/><rect x="30" y="29" width="6" height="2"/><rect x="30" y="32.5" width="6" height="2"/><rect x="30" y="36" width="6" height="2"/><rect x="30" y="39.5" width="6" height="2"/><rect x="30" y="43" width="6" height="2"/><rect x="30" y="46.5" width="6" height="2"/><rect x="30" y="50" width="6" height="2"/><rect x="30" y="53.5" width="6" height="2"/><rect x="30" y="57" width="6" height="0.5"/><rect x="30" y="57.5" width="6" height="1.5"/></svg>';

  var TOPICS = [
    {key:'world',       label:'World',       color:'var(--accent-world)'},
    {key:'sports',      label:'Sports',      color:'var(--accent-sports)'},
    {key:'business',    label:'Business',    color:'var(--accent-business)'},
    {key:'ai',          label:'AI & Tech',   color:'var(--accent-ai)'},
    {key:'geopolitics', label:'Geopolitics', color:'var(--accent-geopolitics)'},
    {key:'portfolio',   label:'Market Watch', color:'var(--accent-portfolio)'},
    {key:'country',     label:'Country',     color:'var(--accent-country)'},
    {key:'doha',        label:'Doha',        color:'var(--accent-doha)'}
  ];
  var COLOR_BY_KEY = {}; TOPICS.forEach(function (t) { COLOR_BY_KEY[t.key] = t.color; });
  COLOR_BY_KEY.skim = 'var(--muted)';

  var EDITIONS_PER_PAGE = 12, RESULTS_PER_PAGE = 16;
  var editions = [], index = [], activeTopic = null, page = 1;
  var view = document.getElementById('view');
  var qEl = document.getElementById('q');
  var qClear = document.getElementById('qClear');

  // Headlines and captions are authored as inline HTML (&mdash;, &rsquo;), so
  // decode those entities to real characters before re-escaping for insertion —
  // otherwise the ampersand escapes again and the entity prints literally.
  function esc(s) {
    var ta = document.createElement('textarea');
    ta.innerHTML = s == null ? '' : String(s);
    var d = document.createElement('div');
    d.textContent = ta.value;
    return d.innerHTML;
  }
  function shortDate(d) {
    var p = String(d).split('-'), m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return m[parseInt(p[1],10)-1] + ' ' + parseInt(p[2],10) + ', ' + p[0];
  }
  function stampDate(d) {
    var p = String(d).split('-'), m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return (p[2].length === 1 ? '0' + p[2] : p[2]) + ' ' + m[parseInt(p[1],10)-1] + ' ' + p[0];
  }
  function highlight(text, terms) {
    var out = esc(text);
    (terms || []).forEach(function (t) {
      if (t.length < 2) return;
      var safe = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      out = out.replace(new RegExp('(' + safe + ')', 'ig'), '<mark>$1</mark>');
    });
    return out;
  }
  function media(url, cls, alt) {
    if (!url) return '<div class="' + cls + '"><div class="ph-fallback" style="display:flex">' + MARK + '</div></div>';
    return '<div class="' + cls + '"><img src="' + esc(url) + '" alt="' + esc(alt || '') + '" referrerpolicy="no-referrer" loading="lazy" ' +
      'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' +
      '<div class="ph-fallback">' + MARK + '</div></div>';
  }

  function renderTopics() {
    document.getElementById('topics').innerHTML = TOPICS.map(function (t) {
      var on = activeTopic === t.key ? ' active' : '';
      return '<button class="topic' + on + '" data-topic="' + t.key + '" style="--t:' + t.color + '">' +
        t.label + '</button>';
    }).join('');
    document.querySelectorAll('.topic').forEach(function (el) {
      el.addEventListener('click', function () {
        var k = el.getAttribute('data-topic');
        activeTopic = (activeTopic === k) ? null : k;
        qEl.value = '';
        qClear.classList.remove('show');
        page = 1;
        renderTopics(); route();
      });
    });
  }

  // Windowed page numbers: 1 … 4 5 [6] 7 8 … 40 — never a wall of buttons
  // when a results list runs to dozens of pages.
  function pageTokens(total, current) {
    var delta = 2, range = [], withDots = [], last;
    for (var i = 1; i <= total; i++) {
      if (i === 1 || i === total || (i >= current - delta && i <= current + delta)) range.push(i);
    }
    range.forEach(function (i) {
      if (last != null) {
        if (i - last === 2) withDots.push(last + 1);
        else if (i - last > 2) withDots.push('…');
      }
      withDots.push(i);
      last = i;
    });
    return withDots;
  }

  function renderPager(total) {
    if (total <= 1) return '';
    var tokens = pageTokens(total, page);
    var html = '<nav class="pager" aria-label="Pagination">';
    html += '<button class="pager-btn" data-page="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>&larr; Prev</button>';
    tokens.forEach(function (t) {
      if (t === '…') { html += '<span class="pager-ellipsis">&hellip;</span>'; return; }
      html += '<button class="pager-num' + (t === page ? ' active' : '') + '" data-page="' + t + '">' + t + '</button>';
    });
    html += '<button class="pager-btn" data-page="' + (page + 1) + '"' + (page >= total ? ' disabled' : '') + '>Next &rarr;</button>';
    html += '</nav>';
    return html;
  }

  function paginate(list, perPage) {
    var total = Math.max(1, Math.ceil(list.length / perPage));
    if (page > total) page = total;
    if (page < 1) page = 1;
    var start = (page - 1) * perPage;
    return { items: list.slice(start, start + perPage), total: total };
  }

  view.addEventListener('click', function (e) {
    var btn = e.target.closest('.pager-btn, .pager-num');
    if (!btn || btn.disabled) return;
    var p = parseInt(btn.getAttribute('data-page'), 10);
    if (!p || p === page) return;
    page = p;
    route();
    view.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  function editionCard(ed) {
    return '<a class="ed-card" href="' + esc(ed.file) + '">' +
      media(ed.hero_image, 'ed-media', '') +
      '<span class="ed-date">' + esc(stampDate(ed.date)) + '</span>' +
      '<p class="ed-cap">' + esc(ed.caption) + '</p></a>';
  }

  function renderBrowse() {
    if (!editions.length) { view.innerHTML = '<div class="empty">No editions yet</div>'; return; }
    var latest = editions[0], rest = editions.slice(1);
    var html = '<a class="latest" href="' + esc(latest.file) + '">' +
      media(latest.hero_image, 'latest-media', '') +
      '<div class="latest-body">' +
      '<span class="latest-kicker">Latest edition</span>' +
      '<h2>' + esc(latest.display_date || stampDate(latest.date)) + '</h2>' +
      '<p class="latest-standfirst">' + esc(latest.caption) + '</p>' +
      '<span class="latest-cta">Read this edition &rarr;</span>' +
      '</div></a>';

    if (rest.length) {
      var paged = paginate(rest, EDITIONS_PER_PAGE);
      html += '<h3 class="block-label">Previous editions</h3><div class="editions">' +
        paged.items.map(editionCard).join('') + '</div>' + renderPager(paged.total);
    } else {
      html += '<div class="empty">More editions appear here each morning</div>';
    }
    view.innerHTML = html;
  }

  function editionFile(date) {
    for (var i = 0; i < editions.length; i++) if (editions[i].date === date) return editions[i].file;
    return 'briefings/' + date + '.html';
  }

  function resultRow(r, terms) {
    var color = COLOR_BY_KEY[r.section_key] || 'var(--muted)';
    var href = r.url || editionFile(r.date);
    var ext = r.url ? ' target="_blank" rel="noopener noreferrer"' : '';
    return '<a class="result" href="' + esc(href) + '"' + ext + '>' +
      '<div class="r-meta"><span class="chip" style="color:' + color + ';border-color:' + color + '">' +
      esc(r.section) + '</span><span class="r-date">' + esc(stampDate(r.date)) + '</span></div>' +
      '<p class="r-headline">' + highlight(r.headline, terms) + '</p>' +
      (r.body ? '<p class="r-body">' + highlight(r.body.slice(0, 260) + (r.body.length > 260 ? '…' : ''), terms) + '</p>' : '') +
      '</a>';
  }

  function renderResults(list, heading, terms) {
    if (!list.length) { view.innerHTML = '<div class="empty">Nothing found</div>'; return; }
    var paged = paginate(list, RESULTS_PER_PAGE);
    view.innerHTML = '<h3 class="block-label">' + esc(heading) + '</h3>' +
      paged.items.map(function (r) { return resultRow(r, terms); }).join('') +
      renderPager(paged.total);
  }

  function route() {
    var q = qEl.value.trim().toLowerCase();
    if (q) {
      var terms = q.split(/\s+/);
      var hits = index.filter(function (r) {
        var hay = (r.headline + ' ' + r.body + ' ' + r.section + ' ' + r.date).toLowerCase();
        return terms.every(function (t) { return hay.indexOf(t) !== -1; });
      });
      renderResults(hits, hits.length + ' result' + (hits.length === 1 ? '' : 's') + ' for “' + qEl.value.trim() + '”', terms);
    } else if (activeTopic) {
      var t = TOPICS.filter(function (x) { return x.key === activeTopic; })[0];
      var rows = index.filter(function (r) { return r.section_key === activeTopic; });
      renderResults(rows, 'Everything in ' + t.label + ' — ' + rows.length + ' stor' + (rows.length === 1 ? 'y' : 'ies'), []);
    } else {
      renderBrowse();
    }
  }

  var t;
  qEl.addEventListener('input', function () {
    clearTimeout(t);
    page = 1;
    qClear.classList.toggle('show', !!qEl.value);
    t = setTimeout(function () { if (qEl.value.trim()) { activeTopic = null; renderTopics(); } route(); }, 140);
  });
  qClear.addEventListener('click', function () {
    qEl.value = ''; qClear.classList.remove('show'); page = 1; route(); qEl.focus();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
    if (e.key === 'Escape' && document.activeElement === qEl) { qEl.blur(); }
  });

  renderTopics();

  Promise.all([
    fetch('manifest.json', {cache:'no-store'}).then(function (r) { return r.json(); }),
    fetch('search-index.json', {cache:'no-store'}).then(function (r) { return r.json(); }).catch(function () { return []; })
  ]).then(function (res) {
    editions = (res[0] || []).sort(function (a, b) { return b.date.localeCompare(a.date); });
    index = res[1] || [];
    var stories = index.filter(function (r) { return r.section_key !== 'skim'; }).length;
    document.getElementById('standfirst').innerHTML =
      'Ankit&rsquo;s morning briefing &middot; ' + editions.length + ' editions &middot; ' + stories + ' stories';
    if (editions.length) {
      document.getElementById('stamp').innerHTML = 'Doha &middot; since ' + stampDate(editions[editions.length - 1].date);
      document.getElementById('brandNote').textContent = 'Latest ' + stampDate(editions[0].date);
    }
    route();
  }).catch(function (e) {
    view.innerHTML = '<div class="empty">Could not load the archive (' + esc(String(e)) + ')</div>';
  });

  document.getElementById('theme-toggle').addEventListener('click', function () {
    var root = document.documentElement;
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('dateline-theme', next); } catch (e) { /* no-op */ }
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', next === 'dark' ? '#15140F' : '#1A1815');
  });

  var topics = document.getElementById('topics');
  var syncEdge = function () {
    topics.classList.toggle('scroll-end',
      topics.scrollLeft + topics.clientWidth >= topics.scrollWidth - 2);
  };
  topics.addEventListener('scroll', syncEdge, { passive: true });
  window.addEventListener('resize', syncEdge);
  syncEdge();

  var backToTop = document.getElementById('back-to-top');
  window.addEventListener('scroll', function () {
    backToTop.classList.toggle('show', window.scrollY > window.innerHeight * 0.9);
  }, { passive: true });
  backToTop.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
</body>
</html>
